<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>优惠上报 - EV充电小程序</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#0891B2',
            secondary: '#22D3EE',
            cta: '#22C55E',
            'app-bg': '#ECFEFF',
            'app-text': '#164E63',
          },
          fontFamily: {
            sans: ['Fira Sans', 'sans-serif'],
            mono: ['Fira Code', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body class="bg-app-bg font-sans min-h-screen pb-24">
  <!-- 状态栏 -->
  <div class="bg-white text-slate-600 px-4 py-2 flex justify-between items-center text-xs border-b border-slate-100">
    <span>09:41</span>
    <div class="flex items-center gap-1">
      <span>100%</span>
    </div>
  </div>

  <!-- 头部 -->
  <header class="bg-white px-4 py-4 border-b border-slate-100 sticky top-0 z-40">
    <div class="flex items-center justify-between">
      <a href="promotions.html" class="w-10 h-10 flex items-center justify-center cursor-pointer hover:bg-slate-50 rounded-lg transition-colors">
        <svg class="w-6 h-6 text-app-text" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </a>
      <h1 class="text-lg font-semibold text-app-text">优惠上报</h1>
      <div class="w-10"></div>
    </div>
  </header>

  <!-- 表单内容 -->
  <form class="px-4 py-4 space-y-4" onsubmit="return false;">
    <!-- 优惠平台 -->
    <div class="glass-card rounded-xl p-4">
      <div class="flex items-center gap-2 mb-3">
        <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
        </svg>
        <label class="text-sm font-medium text-slate-600">优惠平台</label>
      </div>
      <div class="grid grid-cols-3 gap-2" id="platformCards">
        <label class="relative cursor-pointer">
          <input type="radio" name="platform" value="teld" class="peer sr-only" checked>
          <div class="h-16 flex flex-col items-center justify-center gap-1 border-2 border-amber-500 rounded-xl bg-amber-50 transition-all cursor-pointer">
            <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
            <span class="text-xs font-medium text-app-text">特来电</span>
          </div>
        </label>
        <label class="relative cursor-pointer">
          <input type="radio" name="platform" value="sgcc" class="peer sr-only">
          <div class="h-16 flex flex-col items-center justify-center gap-1 border-2 border-slate-200 rounded-xl peer-checked:border-primary peer-checked:bg-primary/5 transition-all cursor-pointer">
            <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
            <span class="text-xs font-medium text-app-text">国家电网</span>
          </div>
        </label>
        <label class="relative cursor-pointer">
          <input type="radio" name="platform" value="starcharge" class="peer sr-only">
          <div class="h-16 flex flex-col items-center justify-center gap-1 border-2 border-slate-200 rounded-xl peer-checked:border-violet-500 peer-checked:bg-violet-50 transition-all cursor-pointer">
            <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
            </svg>
            <span class="text-xs font-medium text-app-text">星星充电</span>
          </div>
        </label>
        <label class="relative cursor-pointer">
          <input type="radio" name="platform" value="xiaoju" class="peer sr-only">
          <div class="h-16 flex flex-col items-center justify-center gap-1 border-2 border-slate-200 rounded-xl peer-checked:border-rose-500 peer-checked:bg-rose-50 transition-all cursor-pointer">
            <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span class="text-xs font-medium text-app-text">小桔充电</span>
          </div>
        </label>
        <label class="relative cursor-pointer">
          <input type="radio" name="platform" value="tesla" class="peer sr-only">
          <div class="h-16 flex flex-col items-center justify-center gap-1 border-2 border-slate-200 rounded-xl peer-checked:border-sky-500 peer-checked:bg-sky-50 transition-all cursor-pointer">
            <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
            <span class="text-xs font-medium text-app-text">特斯拉超充</span>
          </div>
        </label>
        <label class="relative cursor-pointer">
          <input type="radio" name="platform" value="yunkuaichong" class="peer sr-only">
          <div class="h-16 flex flex-col items-center justify-center gap-1 border-2 border-slate-200 rounded-xl peer-checked:border-emerald-500 peer-checked:bg-emerald-50 transition-all cursor-pointer">
            <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
            <span class="text-xs font-medium text-app-text">云快充</span>
          </div>
        </label>
      </div>
    </div>

    <!-- 优惠时间 -->
    <div class="glass-card rounded-xl p-4">
      <div class="flex items-center gap-2 mb-2">
        <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <label class="text-sm font-medium text-slate-600">优惠时间</label>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs text-slate-500 mb-1.5">开始时间</label>
          <input type="datetime-local" class="w-full h-12 px-4 bg-white border border-slate-200 rounded-lg text-app-text focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-colors">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1.5">结束时间</label>
          <input type="datetime-local" class="w-full h-12 px-4 bg-white border border-slate-200 rounded-lg text-app-text focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-colors">
        </div>
      </div>
    </div>

    <!-- 优惠内容 -->
    <div class="glass-card rounded-xl p-4">
      <div class="flex items-center gap-2 mb-2">
        <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"/>
        </svg>
        <label class="text-sm font-medium text-slate-600">优惠内容</label>
      </div>
      <input type="text" placeholder="如：新人立减5元" class="w-full h-12 px-4 bg-white border border-slate-200 rounded-lg text-app-text placeholder-slate-400 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-colors">
    </div>

    <!-- 优惠金额 -->
    <div class="glass-card rounded-xl p-4">
      <div class="flex items-center gap-2 mb-2">
        <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <label class="text-sm font-medium text-slate-600">优惠金额</label>
      </div>
      <div class="relative">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-sm text-slate-400">¥</span>
        <input type="number" placeholder="0.00" step="0.01" class="w-full h-12 pl-8 pr-4 bg-white border border-slate-200 rounded-lg text-app-text font-mono placeholder-slate-400 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-colors">
      </div>
    </div>

    <!-- 优惠标签 -->
    <div class="glass-card rounded-xl p-4">
      <div class="flex items-center gap-2 mb-3">
        <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
        </svg>
        <label class="text-sm font-medium text-slate-600">优惠标签</label>
      </div>
      <div class="flex flex-wrap gap-2">
        <label class="cursor-pointer">
          <input type="radio" name="tag" value="新人优惠" class="peer sr-only" checked>
          <span class="inline-block px-3 py-1.5 text-xs font-medium rounded-full border-2 border-amber-500 bg-amber-50 text-amber-700 peer-checked:border-amber-500 peer-checked:bg-amber-50 peer-checked:text-amber-700 transition-all">新人优惠</span>
        </label>
        <label class="cursor-pointer">
          <input type="radio" name="tag" value="限时活动" class="peer sr-only">
          <span class="inline-block px-3 py-1.5 text-xs font-medium rounded-full border-2 border-slate-200 text-slate-500 peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:text-primary transition-all">限时活动</span>
        </label>
        <label class="cursor-pointer">
          <input type="radio" name="tag" value="会员专享" class="peer sr-only">
          <span class="inline-block px-3 py-1.5 text-xs font-medium rounded-full border-2 border-slate-200 text-slate-500 peer-checked:border-violet-500 peer-checked:bg-violet-50 peer-checked:text-violet-600 transition-all">会员专享</span>
        </label>
        <label class="cursor-pointer">
          <input type="radio" name="tag" value="周末特惠" class="peer sr-only">
          <span class="inline-block px-3 py-1.5 text-xs font-medium rounded-full border-2 border-slate-200 text-slate-500 peer-checked:border-rose-500 peer-checked:bg-rose-50 peer-checked:text-rose-600 transition-all">周末特惠</span>
        </label>
        <label class="cursor-pointer">
          <input type="radio" name="tag" value="每日签到" class="peer sr-only">
          <span class="inline-block px-3 py-1.5 text-xs font-medium rounded-full border-2 border-slate-200 text-slate-500 peer-checked:border-emerald-500 peer-checked:bg-emerald-50 peer-checked:text-emerald-600 transition-all">每日签到</span>
        </label>
      </div>
    </div>

    <!-- 领取步骤 -->
    <div class="glass-card rounded-xl p-4">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-2">
          <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
          </svg>
          <label class="text-sm font-medium text-slate-600">领取步骤</label>
        </div>
        <span class="text-xs text-slate-400">每行一步</span>
      </div>
      <textarea placeholder="1. 打开特来电APP&#10;2. 进入优惠中心&#10;3. 点击新人专区&#10;4. 领取立减券" rows="5" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-lg text-app-text placeholder-slate-400 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-colors resize-none"></textarea>
    </div>

    <!-- 跳转链接 -->
    <div class="glass-card rounded-xl p-4">
      <div class="flex items-center gap-2 mb-2">
        <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
        </svg>
        <label class="text-sm font-medium text-slate-600">跳转链接</label>
      </div>
      <input type="url" placeholder="https://example.com/promotion" class="w-full h-12 px-4 bg-white border border-slate-200 rounded-lg text-app-text placeholder-slate-400 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-colors">
    </div>

    <!-- 提交按钮 -->
    <div class="pt-2 pb-4">
      <button type="button" onclick="showToast()" class="w-full h-14 bg-cta text-white font-semibold rounded-xl shadow-lg shadow-cta/20 hover:bg-cta/90 active:scale-[0.98] transition-all">
        提交上报
      </button>
    </div>
  </form>

  <!-- 底部导航 -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 z-50">
    <div class="flex items-center justify-around py-2 px-4">
      <a href="dashboard.html" class="flex flex-col items-center gap-0.5 py-1 text-slate-400 hover:text-primary transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z"/>
        </svg>
        <span class="text-[10px]">首页</span>
      </a>
      <a href="history.html" class="flex flex-col items-center gap-0.5 py-1 text-slate-400 hover:text-primary transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span class="text-[10px]">记录</span>
      </a>
      <a href="add-record.html" class="flex flex-col items-center gap-0.5 -mt-4">
        <div class="w-12 h-12 bg-cta rounded-full flex items-center justify-center shadow-lg shadow-cta/30">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
          </svg>
        </div>
        <span class="text-[10px] text-cta font-medium">录入</span>
      </a>
      <a href="analytics.html" class="flex flex-col items-center gap-0.5 py-1 text-slate-400 hover:text-primary transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
        <span class="text-[10px]">分析</span>
      </a>
      <a href="profile.html" class="flex flex-col items-center gap-0.5 py-1 text-slate-400 hover:text-primary transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
        <span class="text-[10px]">我的</span>
      </a>
    </div>
  </nav>

  <script>
    // 平台选择颜色切换
    const platformColors = {
      teld: { border: 'border-amber-500', bg: 'bg-amber-50', icon: 'text-amber-500' },
      sgcc: { border: 'border-primary', bg: 'bg-primary/5', icon: 'text-primary' },
      starcharge: { border: 'border-violet-500', bg: 'bg-violet-50', icon: 'text-violet-500' },
      xiaoju: { border: 'border-rose-500', bg: 'bg-rose-50', icon: 'text-rose-500' },
      tesla: { border: 'border-sky-500', bg: 'bg-sky-50', icon: 'text-sky-500' },
      yunkuaichong: { border: 'border-emerald-500', bg: 'bg-emerald-50', icon: 'text-emerald-500' }
    };

    document.querySelectorAll('input[name="platform"]').forEach(radio => {
      radio.addEventListener('change', function() {
        const cards = document.querySelectorAll('#platformCards > label > div');
        const icons = document.querySelectorAll('#platformCards svg');
        cards.forEach((card, i) => {
          card.className = 'h-16 flex flex-col items-center justify-center gap-1 border-2 border-slate-200 rounded-xl transition-all cursor-pointer';
          icons[i].className = 'w-5 h-5 text-slate-400';
        });
        const idx = Array.from(document.querySelectorAll('input[name="platform"]')).indexOf(this);
        const colors = platformColors[this.value];
        if (colors) {
          cards[idx].classList.remove('border-slate-200');
          cards[idx].classList.add(colors.border, colors.bg);
          icons[idx].classList.remove('text-slate-400');
          icons[idx].classList.add(colors.icon);
        }
      });
    });

    // 标签选择切换
    document.querySelectorAll('input[name="tag"]').forEach(radio => {
      radio.addEventListener('change', function() {
        document.querySelectorAll('input[name="tag"]').forEach(r => {
          const span = r.nextElementSibling;
          span.className = 'inline-block px-3 py-1.5 text-xs font-medium rounded-full border-2 border-slate-200 text-slate-500 transition-all';
        });
        const span = this.nextElementSibling;
        const tagColors = {
          '新人优惠': 'border-amber-500 bg-amber-50 text-amber-700',
          '限时活动': 'border-primary bg-primary/5 text-primary',
          '会员专享': 'border-violet-500 bg-violet-50 text-violet-600',
          '周末特惠': 'border-rose-500 bg-rose-50 text-rose-600',
          '每日签到': 'border-emerald-500 bg-emerald-50 text-emerald-600'
        };
        const cls = tagColors[this.value] || 'border-primary bg-primary/5 text-primary';
        span.className = 'inline-block px-3 py-1.5 text-xs font-medium rounded-full border-2 ' + cls + ' transition-all';
      });
    });

    // Toast提示
    function showToast() {
      const toast = document.createElement('div');
      toast.className = 'fixed top-20 left-1/2 -translate-x-1/2 bg-cta text-white px-6 py-3 rounded-xl shadow-lg z-50 text-sm font-medium transition-opacity duration-300';
      toast.textContent = '优惠上报成功！';
      document.body.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; }, 1500);
      setTimeout(() => { toast.remove(); }, 1800);
    }
  </script>
</body>
</html>
