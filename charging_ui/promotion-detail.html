<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>优惠详情 - EV充电小程序</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#0891B2',
            secondary: '#22D3EE',
            cta: '#22C55E',
            'app-bg': '#ECFEFF',
            'app-text': '#164E63',
          },
          fontFamily: {
            sans: ['Fira Sans', 'sans-serif'],
            mono: ['Fira Code', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body class="bg-app-bg font-sans min-h-screen pb-28">
  <!-- 状态栏 -->
  <div class="bg-white text-slate-600 px-4 py-2 flex justify-between items-center text-xs border-b border-slate-100">
    <span>09:41</span>
    <div class="flex items-center gap-1">
      <span>100%</span>
    </div>
  </div>

  <!-- 头部 -->
  <header class="bg-white px-4 py-4 border-b border-slate-100 sticky top-0 z-40">
    <div class="flex items-center justify-between">
      <a href="promotions.html" class="w-10 h-10 flex items-center justify-center cursor-pointer hover:bg-slate-50 rounded-lg transition-colors">
        <svg class="w-6 h-6 text-app-text" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </a>
      <h1 class="text-lg font-semibold text-app-text">优惠详情</h1>
      <button onclick="enterEditMode()" id="editBtn" class="w-10 h-10 flex items-center justify-center hover:bg-slate-50 rounded-lg transition-colors">
        <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
        </svg>
      </button>
      <button onclick="exitEditMode()" id="cancelBtn" class="hidden px-3 py-1.5 text-sm text-primary font-medium hover:bg-primary/5 rounded-lg transition-colors">取消</button>
    </div>
  </header>

  <!-- 领取示例图 -->
  <div class="px-4 pt-4">
    <div class="glass-card rounded-xl overflow-hidden">
      <div class="h-48 bg-gradient-to-br from-amber-400 via-orange-500 to-rose-500 flex items-center justify-center relative">
        <div class="absolute inset-0 opacity-10">
          <div class="absolute top-4 left-4 w-20 h-20 border-2 border-white rounded-full"></div>
          <div class="absolute bottom-6 right-6 w-16 h-16 border-2 border-white rounded-full"></div>
          <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-32 h-32 border border-white rounded-full"></div>
        </div>
        <div class="text-center z-10">
          <svg class="w-12 h-12 text-white mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7M5 12H4a2 2 0 01-2-2v-1a2 2 0 012-2h1m14 0h1a2 2 0 012 2v1a2 2 0 01-2 2h-1"/>
          </svg>
          <p class="text-white font-semibold text-lg">特来电新人优惠</p>
          <p class="text-white/80 text-sm mt-1">领取示例图</p>
        </div>
      </div>
    </div>
  </div>

  <!-- 优惠信息卡 -->
  <div class="px-4 pt-4 space-y-4">
    <!-- 基本信息 -->
    <div class="glass-card rounded-xl p-4">
      <div class="flex items-center gap-2 mb-3">
        <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
        <h3 class="text-sm font-semibold text-app-text">优惠信息</h3>
      </div>
      <div class="space-y-3">
        <div class="flex justify-between items-center py-2 border-b border-slate-100">
          <span class="text-sm text-slate-500">优惠平台</span>
          <div class="flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-amber-500"></span>
            <span class="text-sm font-medium text-app-text">特来电</span>
          </div>
        </div>
        <div class="flex justify-between items-center py-2 border-b border-slate-100">
          <span class="text-sm text-slate-500">优惠标签</span>
          <span class="px-2 py-0.5 text-xs font-medium rounded-full bg-amber-50 text-amber-700 border border-amber-200">新人优惠</span>
        </div>
        <div class="flex justify-between items-center py-2 border-b border-slate-100">
          <span class="text-sm text-slate-500">优惠内容</span>
          <span class="text-sm font-medium text-app-text">新人立减5元</span>
        </div>
        <div class="flex justify-between items-center py-2 border-b border-slate-100">
          <span class="text-sm text-slate-500">优惠金额</span>
          <span class="text-sm font-semibold text-cta font-mono">¥5.00</span>
        </div>
        <div class="flex justify-between items-center py-2">
          <span class="text-sm text-slate-500">有效时间</span>
          <span class="text-xs text-slate-600 font-mono">2026.06.01 - 2026.07.31</span>
        </div>
      </div>
    </div>

    <!-- 领取步骤 -->
    <div class="glass-card rounded-xl p-4">
      <div class="flex items-center gap-2 mb-4">
        <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
        </svg>
        <h3 class="text-sm font-semibold text-app-text">领取步骤</h3>
      </div>
      <div class="space-y-4">
        <div class="flex gap-3">
          <div class="flex flex-col items-center">
            <div class="w-7 h-7 rounded-full bg-amber-500 text-white flex items-center justify-center text-xs font-semibold shrink-0">1</div>
            <div class="w-0.5 h-full bg-amber-200 mt-1"></div>
          </div>
          <div class="pb-4">
            <p class="text-sm font-medium text-app-text">打开特来电APP</p>
            <p class="text-xs text-slate-400 mt-0.5">确保已登录账号</p>
          </div>
        </div>
        <div class="flex gap-3">
          <div class="flex flex-col items-center">
            <div class="w-7 h-7 rounded-full bg-amber-500 text-white flex items-center justify-center text-xs font-semibold shrink-0">2</div>
            <div class="w-0.5 h-full bg-amber-200 mt-1"></div>
          </div>
          <div class="pb-4">
            <p class="text-sm font-medium text-app-text">进入优惠中心</p>
            <p class="text-xs text-slate-400 mt-0.5">首页点击"优惠"入口</p>
          </div>
        </div>
        <div class="flex gap-3">
          <div class="flex flex-col items-center">
            <div class="w-7 h-7 rounded-full bg-amber-500 text-white flex items-center justify-center text-xs font-semibold shrink-0">3</div>
            <div class="w-0.5 h-full bg-amber-200 mt-1"></div>
          </div>
          <div class="pb-4">
            <p class="text-sm font-medium text-app-text">点击新人专区</p>
            <p class="text-xs text-slate-400 mt-0.5">找到新人专属优惠区域</p>
          </div>
        </div>
        <div class="flex gap-3">
          <div class="flex flex-col items-center">
            <div class="w-7 h-7 rounded-full bg-cta text-white flex items-center justify-center text-xs font-semibold shrink-0">4</div>
          </div>
          <div>
            <p class="text-sm font-medium text-app-text">领取立减券</p>
            <p class="text-xs text-slate-400 mt-0.5">点击领取，自动存入卡包</p>
          </div>
        </div>
      </div>
    </div>

    <!-- 跳转链接 -->
    <div class="glass-card rounded-xl p-4">
      <div class="flex items-center gap-2 mb-3">
        <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
        </svg>
        <h3 class="text-sm font-semibold text-app-text">跳转链接</h3>
      </div>
      <a href="https://www.teld.com/promo/newuser" target="_blank" class="flex items-center justify-between p-3 bg-primary/5 rounded-lg border border-primary/20 hover:bg-primary/10 transition-colors">
        <div class="flex items-center gap-2">
          <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
          </svg>
          <span class="text-sm text-primary font-medium">前往特来电领取优惠</span>
        </div>
        <svg class="w-4 h-4 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </a>
    </div>
  </div>

  <!-- 底部操作按钮 -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 p-4 z-50">
    <div class="flex gap-3">
      <button onclick="showDeleteConfirm()" class="h-12 px-6 border-2 border-rose-200 text-rose-500 font-semibold rounded-xl hover:bg-rose-50 active:scale-[0.98] transition-all">
        删除
      </button>
      <button id="saveBtn" class="hidden flex-1 h-12 bg-cta text-white font-semibold rounded-xl shadow-lg shadow-cta/20 hover:bg-cta/90 active:scale-[0.98] transition-all">
        保存修改
      </button>
      <a href="https://www.teld.com/promo/newuser" target="_blank" id="goBtn" class="flex-1 h-12 bg-cta text-white font-semibold rounded-xl shadow-lg shadow-cta/20 hover:bg-cta/90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
        </svg>
        立即领取
      </a>
    </div>
  </div>

  <!-- 删除确认弹窗 -->
  <div id="deleteDrawer" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/40" onclick="hideDeleteConfirm()"></div>
    <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-2xl p-6 transform transition-transform duration-300 translate-y-full" id="drawerContent">
      <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-4"></div>
      <h3 class="text-lg font-semibold text-app-text mb-2">确认删除</h3>
      <p class="text-sm text-slate-500 mb-6">删除后将无法恢复此优惠记录，确定要删除吗？</p>
      <div class="flex gap-3">
        <button onclick="hideDeleteConfirm()" class="flex-1 h-12 border border-slate-200 text-slate-600 font-medium rounded-xl hover:bg-slate-50 transition-colors">取消</button>
        <button onclick="confirmDelete()" class="flex-1 h-12 bg-rose-500 text-white font-medium rounded-xl hover:bg-rose-600 transition-colors">删除</button>
      </div>
    </div>
  </div>

  <script>
    let isEditMode = false;

    function enterEditMode() {
      isEditMode = true;
      document.getElementById('editBtn').classList.add('hidden');
      document.getElementById('cancelBtn').classList.remove('hidden');
      document.getElementById('saveBtn').classList.remove('hidden');
      document.getElementById('saveBtn').classList.add('flex-1');
      document.getElementById('goBtn').classList.add('hidden');
    }

    function exitEditMode() {
      isEditMode = false;
      document.getElementById('editBtn').classList.remove('hidden');
      document.getElementById('cancelBtn').classList.add('hidden');
      document.getElementById('saveBtn').classList.add('hidden');
      document.getElementById('saveBtn').classList.remove('flex-1');
      document.getElementById('goBtn').classList.remove('hidden');
    }

    function showDeleteConfirm() {
      const drawer = document.getElementById('deleteDrawer');
      const content = document.getElementById('drawerContent');
      drawer.classList.remove('hidden');
      setTimeout(() => { content.classList.remove('translate-y-full'); }, 10);
    }

    function hideDeleteConfirm() {
      const content = document.getElementById('drawerContent');
      content.classList.add('translate-y-full');
      setTimeout(() => { document.getElementById('deleteDrawer').classList.add('hidden'); }, 300);
    }

    function confirmDelete() {
      hideDeleteConfirm();
      showToast('已删除');
      setTimeout(() => { window.location.href = 'promotions.html'; }, 800);
    }

    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = 'fixed top-20 left-1/2 -translate-x-1/2 bg-app-text text-white px-6 py-3 rounded-xl shadow-lg z-[60] text-sm font-medium transition-opacity duration-300';
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; }, 1500);
      setTimeout(() => { toast.remove(); }, 1800);
    }
  </script>
</body>
</html>
